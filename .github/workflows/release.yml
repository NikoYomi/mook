name: Release

# 推送 v* 标签时触发：构建 Windows / macOS / fnOS 三个安装包，统一挂到 GitHub Release。
# Docker 镜像由 docker-build.yml 负责推送（同一标签触发，互不干涉）。
#
# 产物命名统一为 mook-<版本号>-<系统>-<机型>，且**只发布这 3 个**：
#   mook-v0.3.0-windows-x64.exe       Windows 安装程序（Inno Setup，非压缩包）
#   mook-v0.3.0-macos-arm64.tar.gz    macOS Apple Silicon（M 系列芯片）
#   mook-v0.3.0-fnos-x86-arm.fpk      飞牛 fnOS（x86 + ARM 通用包）
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ---------- 前端：构建一次，供各平台复用 ----------
  frontend:
    name: Build frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        working-directory: frontend
        run: npm install --no-package-lock

      # npm run build = tsc --noEmit && vite build，类型错误会在这里被拦下
      - name: Build
        working-directory: frontend
        run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: error

  # ---------- macOS：Apple Silicon（M 系列）----------
  macos:
    name: macos-arm64
    needs: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Build binary
        working-directory: backend
        env:
          GOOS: darwin
          GOARCH: arm64
          # modernc.org/sqlite 为纯 Go 实现，关闭 CGO 即可交叉编译
          CGO_ENABLED: "0"
        run: go build -trimpath -ldflags="-s -w" -o "../build/mook" .

      - name: Assemble package
        run: |
          set -euo pipefail
          NAME="mook-${GITHUB_REF_NAME}-macos-arm64"
          PKG="build/pkg/${NAME}"
          mkdir -p "$PKG"
          cp build/mook "$PKG/"
          cp -r frontend/dist "$PKG/dist"
          cp README.md LICENSE "$PKG/"
          printf '%s\n' "$NAME" > "$PKG/VERSION"

          cat > "$PKG/start.sh" <<'SH'
          #!/bin/sh
          cd "$(dirname "$0")" || exit 1
          export MOOK_DIST="$PWD/dist"
          echo "Mook 启动中，浏览器访问 http://localhost:${MOOK_PORT:-5866}"
          exec ./mook "$@"
          SH
          chmod +x "$PKG/start.sh"

          # 归档带上顶层目录名，保证解压后落在一个独立文件夹里
          mkdir -p build/out
          tar -czf "build/out/${NAME}.tar.gz" -C build/pkg "$NAME"
          ls -lh "build/out/${NAME}.tar.gz"

      - name: Verify package
        run: |
          set -euo pipefail
          NAME="mook-${GITHUB_REF_NAME}-macos-arm64"
          TARBALL="build/out/${NAME}.tar.gz"

          # 先落盘再 grep，避免 `tar -tzf | grep -q` 触发 SIGPIPE 被 pipefail 误判
          tar -tzf "$TARBALL" > list.txt
          echo "----- 包内文件（前 20 项）-----"
          head -20 list.txt
          echo "-----------------------------"

          for f in "${NAME}/mook" "${NAME}/dist/index.html" "${NAME}/start.sh" "${NAME}/VERSION"; do
            grep -qx "$f" list.txt || { echo "::error::包内缺少 $f"; exit 1; }
          done

          # 可执行位必须保留，否则用户解压后没法直接跑
          mode=$(tar -tvzf "$TARBALL" | awk -v t="${NAME}/mook" '$NF==t {print $1}')
          case "$mode" in
            *x*) echo "✓ mook 可执行位: $mode" ;;
            *)   echo "::error::mook 丢失可执行位（$mode）"; exit 1 ;;
          esac
          echo "✓ macOS 包完整性校验通过"

      - uses: actions/upload-artifact@v4
        with:
          name: pkg-macos-arm64
          path: build/out/*.tar.gz
          if-no-files-found: error

  # ---------- Windows：真正的安装程序（Inno Setup）----------
  # 注意：Go 交叉编译在 ubuntu 上就能做，但生成 .exe 安装程序需要 Windows 工具链，
  # 所以这个 job 单独跑在 windows-latest 上（该镜像自带 Inno Setup 6.7.x）。
  windows:
    name: windows-x64 installer
    needs: frontend
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Build mook.exe
        working-directory: backend
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: go build -trimpath -ldflags="-s -w" -o "../build/mook.exe" .

      - name: Stage files
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $stage = "build/winpkg"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "build/mook.exe" "$stage/mook.exe"
          Copy-Item "frontend/dist" "$stage/dist" -Recurse
          Copy-Item "README.md" $stage
          Copy-Item "LICENSE" $stage
          Copy-Item "packaging/windows/mook.ico" "$stage/mook.ico"
          Get-ChildItem $stage | Select-Object Name, Length

      # 启动脚本必须只有 ASCII：cmd.exe 默认代码页(936)下中文会显示成乱码。
      # Set-Content 在 Windows 上写出 CRLF 行尾，正好是 .cmd 需要的。
      - name: Write launcher
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $ver = "${{ github.ref_name }}".TrimStart("v")
          $lines = @(
            '@echo off'
            'setlocal'
            'set "MOOK_HOME=%~dp0"'
            'if not defined MOOK_DATA set "MOOK_DATA=%LOCALAPPDATA%\Mook\data"'
            'if not defined MOOK_PORT set "MOOK_PORT=5866"'
            'if not defined MOOK_DIST set "MOOK_DIST=%MOOK_HOME%dist"'
            'cd /d "%MOOK_HOME%"'
            'echo.'
            ('echo   Mook v' + $ver)
            'echo   Open:  http://localhost:%MOOK_PORT%'
            'echo   Data:  %MOOK_DATA%'
            'echo.'
            'echo   Press Ctrl+C to stop this server.'
            'echo.'
            '"%MOOK_HOME%mook.exe" %*'
            'if errorlevel 1 ('
            '  echo.'
            '  echo   Mook exited unexpectedly. Press any key to close.'
            '  pause >nul'
            ')'
          )
          Set-Content -Path "build/winpkg/mook-launch.cmd" -Value $lines -Encoding ASCII
          Get-Content "build/winpkg/mook-launch.cmd"

      # Inno Setup 6.x 的 Languages\ 目录里没有 ChineseSimplified.isl（中文当时还属
      # Unofficial，7.x 才转正），所以这里主动去官方源码仓取一份。取与 6.x 同代的标签
      # 下的文件，版本匹配能最大程度避免 [Messages] 缺项；取不到就退回英文向导。
      - name: Fetch Chinese language file
        shell: pwsh
        continue-on-error: true
        run: |
          $url  = "https://raw.githubusercontent.com/jrsoftware/issrc/is-6_7_0/Files/Languages/Unofficial/ChineseSimplified.isl"
          $dest = "build/winpkg/ChineseSimplified.isl"
          try {
            Invoke-WebRequest -Uri $url -OutFile $dest -UseBasicParsing
            Write-Host "已取得中文语言包: $((Get-Item $dest).Length) 字节"
          } catch {
            Write-Warning "中文语言包获取失败，将使用英文向导: $_"
          }

      - name: Build installer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $ver   = "${{ github.ref_name }}".TrimStart("v")
          $base  = "mook-v$ver-windows-x64"
          $stage = (Resolve-Path "build/winpkg").Path
          $out   = Join-Path (Get-Location).Path "build/out"
          New-Item -ItemType Directory -Force -Path $out | Out-Null

          # 优先用 runner 预装的 Inno Setup；找不到再退回 choco 安装
          $roots = @(${env:ProgramFiles(x86)}, $env:ProgramFiles) | Where-Object { $_ }
          $candidates = $roots | ForEach-Object { Join-Path $_ "Inno Setup 6\ISCC.exe" }
          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            Write-Warning "未找到预装的 Inno Setup，改用 choco 安装"
            choco install innosetup -y --no-progress
            $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $iscc) { throw "找不到 ISCC.exe，无法编译安装程序" }
          Write-Host "使用编译器: $iscc"

          $defines = @(
            "/DAppVersion=$ver",
            "/DSourceDir=$stage",
            "/DOutputDir=$out",
            "/DOutputBase=$base",
            "/DIconFile=$stage\mook.ico"
          )

          # 中文语言包：优先用 Inno Setup 自带（7.0.2 起才进入 Languages\ 主目录），
          # 否则用上面下载的那份（6.x 全系都只能走这条路）。
          $bundled    = Join-Path (Split-Path $iscc) "Languages\ChineseSimplified.isl"
          $downloaded = Join-Path $stage "ChineseSimplified.isl"
          $hasZh = $true
          # -LiteralPath + -PathType Leaf：只认真实文件，避免同名目录让 Test-Path 误判
          if (Test-Path -LiteralPath $bundled -PathType Leaf) {
            $defines += "/DZhLang=compiler:Languages\ChineseSimplified.isl"
            Write-Host "使用 Inno Setup 自带的中文语言包"
          } elseif (Test-Path -LiteralPath $downloaded -PathType Leaf) {
            $defines += "/DZhLang=$downloaded"
            Write-Host "使用下载的中文语言包: $downloaded"
          } else {
            $hasZh = $false
            Write-Warning "未取得中文语言包，向导使用英文"
          }

          $zhOk = $false
          & $iscc @defines "packaging\windows\mook.iss"
          if ($LASTEXITCODE -eq 0 -and $hasZh) { $zhOk = $true }
          # 语言文件若与编译器版本对不上（[Messages] 缺项），ISCC 会直接失败。
          # 这里去掉中文重试一次，保证「最差也只是英文向导」，不会让整个发版挂掉。
          if ($LASTEXITCODE -ne 0 -and $hasZh) {
            Write-Warning "带中文语言包编译失败（退出码 $LASTEXITCODE），改用英文向导重试"
            Remove-Item (Join-Path $out "*.exe") -Force -ErrorAction SilentlyContinue
            $defines = $defines | Where-Object { $_ -notlike "/DZhLang=*" }
            & $iscc @defines "packaging\windows\mook.iss"
          }
          if ($LASTEXITCODE -ne 0) { throw "ISCC 编译失败，退出码 $LASTEXITCODE" }

          # ISCC 只有成功解析并嵌入语言文件才会退出 0，所以 $zhOk 为真即证明中文确实编进去了。
          # 结果写进 job summary，避免「静默出英文」这种问题再次无人察觉。
          $lang = if ($zhOk) { "简体中文 + English" } else { "仅 English ⚠️" }
          Write-Host "安装程序向导语言: $lang"
          if (-not $zhOk) { Write-Host "::warning::本次安装程序向导为英文（中文语言包未生效）" }
          if ($env:GITHUB_STEP_SUMMARY) {
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- 安装程序向导语言: $lang"
          }

      - name: Verify installer
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}".TrimStart("v")
          $exe = "build/out/mook-v$ver-windows-x64.exe"
          if (-not (Test-Path $exe)) { throw "未生成安装程序: $exe" }
          Get-Item $exe | Select-Object Name, Length
          # 安装程序本身必须是合法的 PE 可执行文件（MZ 头）
          $head = [System.IO.File]::ReadAllBytes($exe)[0..1]
          if ($head[0] -ne 0x4D -or $head[1] -ne 0x5A) {
            throw "产物不是合法的 Windows 可执行文件"
          }
          Write-Host "✓ 安装程序校验通过: $exe"

      - uses: actions/upload-artifact@v4
        with:
          name: pkg-windows-x64
          path: build/out/*.exe
          if-no-files-found: error

  # ---------- 飞牛 fnOS 应用包 ----------
  fpk:
    name: Build fnOS fpk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install fnpack
        run: |
          set -euo pipefail
          curl -fsSL -o fnpack https://static2.fnnas.com/fnpack/fnpack-1.2.3-linux-amd64
          chmod +x fnpack
          sudo mv fnpack /usr/local/bin/fnpack
          fnpack --help >/dev/null

      # manifest 中的 version 必须与发布标签一致，避免应用中心版本号错乱。
      # 顺手把版本号与最终产物名写进 GITHUB_ENV，供后续步骤复用。
      - name: Resolve version and sync manifest
        run: |
          set -euo pipefail
          VER="${GITHUB_REF_NAME#v}"
          echo "VER=$VER" >> "$GITHUB_ENV"
          echo "FPK_NAME=mook-v${VER}-fnos-x86-arm.fpk" >> "$GITHUB_ENV"
          sed -i "s/^version=.*/version=${VER}/" fnos/manifest
          grep '^version=' fnos/manifest

      # 注意：fnpack 打包失败时仍会返回 exit 0（例如缺少 cmd/ 生命周期脚本），
      # 必须显式校验产物是否存在，否则这一步会「假绿」而后续上传产物才报错。
      - name: Build fpk
        run: |
          set -euo pipefail
          fnpack build --directory fnos
          if [ ! -f mook.fpk ]; then
            echo "::error::fnpack 未生成 mook.fpk，打包失败（请检查 fnos/cmd 下的生命周期脚本是否齐全）"
            exit 1
          fi
          # fnpack 固定按 manifest 里的 appname 输出 mook.fpk，这里改成统一的发布命名
          mv mook.fpk "$FPK_NAME"
          ls -lh "$FPK_NAME"
          echo "fpk 大小: $(stat -c%s "$FPK_NAME") 字节"

      # 产物校验：确认包内确实含全部必需的生命周期脚本，避免装到设备上才发现问题
      # 注意：.fpk 是 gzip 压缩的 tar 包（不是 zip），必须用 tar 读取
      #
      # ⚠️ 必须先把清单落到文件再 grep，不能写成 `tar -tzf x.fpk | grep -qx "$f"`：
      #    GNU tar 逐条输出、grep -q 命中即退出 → tar 收到 SIGPIPE(141)，
      #    配合 `set -o pipefail` 会把「已找到」误判成「缺失」。
      #    （bsdtar 会整体缓冲，所以在 macOS 上无法复现，只在 Linux runner 上炸）
      - name: Verify fpk contents
        run: |
          set -euo pipefail
          tar -tzf "$FPK_NAME" > fpk-list.txt
          echo "----- fpk 包内文件清单 -----"
          cat fpk-list.txt
          echo "---------------------------"

          missing=""
          for f in cmd/main cmd/install_init cmd/install_callback \
                   cmd/upgrade_init cmd/upgrade_callback \
                   cmd/uninstall_init cmd/uninstall_callback; do
            grep -qx "$f" fpk-list.txt || missing="$missing $f"
          done

          if [ -n "$missing" ]; then
            echo "::error::$FPK_NAME 内缺少必需文件:$missing"
            exit 1
          fi
          echo "✓ fpk 包完整性校验通过"

      - uses: actions/upload-artifact@v4
        with:
          name: pkg-fnos-x86-arm
          path: "*.fpk"
          if-no-files-found: error

  # ---------- 汇总发布 ----------
  release:
    name: Publish Release
    needs: [macos, windows, fpk]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 只下载要发布的产物。注意不能省略 pattern —— 不指定 name/pattern 会把
      # 所有 artifact 全拉下来，中间产物 frontend-dist 会跟着混进 Release。
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: pkg-*
          merge-multiple: true

      # 守住「只发 3 个产物」这条线：多了（混入中间产物）或少了（某平台没构建成功）都拦下
      - name: Verify asset count
        run: |
          set -euo pipefail
          ls -lh artifacts
          n=$(find artifacts -type f | wc -l)
          if [ "$n" -ne 3 ]; then
            echo "::error::Release 应当只挂 3 个产物，实际 $n 个"
            exit 1
          fi
          echo "✓ 产物数量正确（3）"

      # 从 README「更新日志」提取当前标签对应的版本说明
      - name: Extract release notes
        shell: bash
        run: |
          set -euo pipefail
          TAG_NAME="${GITHUB_REF_NAME}"
          awk -v tag="$TAG_NAME" '
            $0 ~ "### " tag { flag=1; next }
            flag && /^### / { exit }
            flag { print }
          ' README.md > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "Release $TAG_NAME" > release_notes.md
          fi

      - uses: softprops/action-gh-release@v2
        with:
          body_path: release_notes.md
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: artifacts/**
