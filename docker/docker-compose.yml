services:
  mook:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        # 默认使用官方源（适合 GitHub Actions / 海外环境）；
        # 国内网络可通过 MOOK_REGISTRY / MOOK_NPM_REGISTRY / MOOK_GOPROXY 覆盖为国内镜像
        BASE_IMAGE: ${MOOK_REGISTRY:-docker.io/library}
        NPM_REGISTRY: ${MOOK_NPM_REGISTRY:-https://registry.npmjs.org}
        GOPROXY: ${MOOK_GOPROXY:-https://proxy.golang.org,direct}
    image: mook/mook:0.2.2
    container_name: mook
    ports:
      - "5866:5866"
    volumes:
      - mook-data:/data
    environment:
      - MOOK_PORT=5866
      - MOOK_DATA=/data
      # - MOOK_PASSWORD=请改成你的密码   # 可选：预设初始管理员密码
    restart: unless-stopped

volumes:
  mook-data: