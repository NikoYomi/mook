<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#020617" />
    <meta name="description" content="Mook - AI 驱动的自托管 SSH 终端与服务器管理工具" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="256x256" href="/icon-256px.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icon-256px.png" />
    <title>Mook · AI SSH 终端</title>
    <script>
      // 首屏前应用主题，避免亮色/暗色闪烁
      ;(function () {
        try {
          var raw = localStorage.getItem('mook.settings')
          var theme = 'dark'
          if (raw) {
            var data = JSON.parse(raw)
            if (data && data.state && data.state.theme) theme = data.state.theme
          }
          var resolved =
            theme === 'system'
              ? window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark'
              : theme
          document.documentElement.dataset.theme = resolved
        } catch (e) {
          document.documentElement.dataset.theme = 'dark'
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
